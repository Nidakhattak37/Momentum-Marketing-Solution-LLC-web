
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum Marketing Solution LLC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020202;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020202; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a2a2a; }

        @keyframes neural-flow {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        .animate-grid-flow {
            animation: neural-flow 240s linear infinite;
        }

        /* Lustrous Metallic Sweep Effect */
        .metallic-sweep {
            position: fixed;
            top: 0; left: -150%; width: 60%; height: 150%;
            background: linear-gradient(105deg, 
                transparent 20%, 
                rgba(255, 255, 255, 0.02) 45%, 
                rgba(255, 255, 255, 0.05) 50%, 
                rgba(255, 255, 255, 0.02) 55%, 
                transparent 80%
            );
            transform: rotate(-15deg);
            animation: sweep 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            pointer-events: none;
            z-index: 1;
            filter: blur(60px);
        }
        @keyframes sweep {
            0% { left: -150%; opacity: 0; }
            15% { opacity: 0.5; }
            50% { left: 150%; opacity: 0.5; }
            85% { opacity: 0; }
            100% { left: 150%; opacity: 0; }
        }

        .shiny-black-depth {
            background: radial-gradient(circle at 50% -40%, #0a1f44 0%, #020202 65%);
            min-height: 100vh;
            position: relative;
        }

        /* Polished glass style */
        .glass-card {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 50px 0 rgba(0, 0, 0, 1);
        }

        .text-shine {
            background: linear-gradient(to right, #ffffff 20%, #64748b 40%, #64748b 60%, #ffffff 80%);
            background-size: 200% auto;
            color: #000;
            background-clip: text;
            text-fill-color: transparent;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine-text 8s linear infinite;
        }

        @keyframes shine-text {
            to { background-position: 200% center; }
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@1.40.0",
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="shiny-black-depth">
    <div class="metallic-sweep"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
