
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum Marketing Solution LLC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #222; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        @keyframes neural-flow {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        .animate-grid-flow {
            animation: neural-flow 240s linear infinite;
        }

        @keyframes shutter-reveal {
            from { clip-path: inset(0 100% 0 0); transform: translateX(-15px); opacity: 0; }
            to { clip-path: inset(0 0 0 0); transform: translateX(0); opacity: 1; }
        }
        .reveal-1 { animation: shutter-reveal 0.8s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
        .reveal-2 { animation: shutter-reveal 0.8s cubic-bezier(0.2, 1, 0.3, 1) 0.2s forwards; opacity: 0; }
        .reveal-3 { animation: shutter-reveal 0.8s cubic-bezier(0.2, 1, 0.3, 1) 0.4s forwards; opacity: 0; }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: scanline 6s linear infinite;
            pointer-events: none;
        }

        .metallic-shine {
            background: linear-gradient(110deg, transparent 45%, rgba(255, 255, 255, 0.03) 50%, transparent 55%);
            background-size: 200% 100%;
            animation: shine 8s linear infinite;
        }
        @keyframes shine {
            0% { background-position: -100% 0; }
            100% { background-position: 100% 0; }
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@1.40.0",
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
